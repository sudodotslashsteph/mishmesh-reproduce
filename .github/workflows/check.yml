name: Reproduce experiments

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-24.04
    container: python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run regression and analytical checks
        run: python3 -m unittest discover -s tests -v
